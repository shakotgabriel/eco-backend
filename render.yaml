# Free Render Blueprint — no paid instances.
# Render does not offer free background workers, so Celery runs inside
# the web service (bin/start-render.sh).
#
# Limits you must accept:
#   - API sleeps after 15 min idle (cold start ~1 min; payment callbacks can miss)
#   - Free Postgres expires after 30 days (then deleted if not upgraded)
#   - Free Redis is in-memory only (queue/cache wiped on restart)
#   - 750 free web hours/month; 1 free Postgres + 1 free Redis per workspace
#
# Dashboard → New → Blueprint → this repo. Fill sync:false secrets.
# After the API URL exists, set callback URLs to
#   https://<bebeto-api>.onrender.com/api/v1/payments/.../callback/

databases:
  - name: bebeto-postgres
    plan: free
    region: frankfurt
    databaseName: bebeto
    user: bebeto

services:
  - type: keyvalue
    name: bebeto-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: noeviction
    persistenceMode: off
    ipAllowList: []

  - type: web
    name: bebeto-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: chmod +x bin/start-render.sh && ./bin/start-render.sh
    healthCheckPath: /healthz/
    envVars:
      - fromGroup: bebeto-settings
      - key: DATABASE_URL
        fromDatabase:
          name: bebeto-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: bebeto-redis
          type: keyvalue
          property: connectionString
      - key: ALLOWED_HOSTS
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        sync: false
      - key: MTN_MOMO_BASE_URL
        sync: false
      - key: MTN_MOMO_COLLECTION_PRIMARY_KEY
        sync: false
      - key: MTN_MOMO_COLLECTION_SECRET
        sync: false
      - key: MTN_MOMO_API_USER
        sync: false
      - key: MTN_MOMO_ENVIRONMENT
        sync: false
      - key: MTN_MOMO_CURRENCY
        sync: false
      - key: MTN_MOMO_CALLBACK_URL
        sync: false
      - key: MTN_MOMO_NOTIFICATION_SECRET
        sync: false
      - key: MPESA_BASE_URL
        sync: false
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_ENVIRONMENT
        sync: false
      - key: MPESA_CALLBACK_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false

envVarGroups:
  - name: bebeto-settings
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.2"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: CELERY_BEAT_SCHEDULER
        value: django_celery_beat.schedulers:DatabaseScheduler
      - key: DEFAULT_FROM_EMAIL
        value: EcoBus <noreply@bebetocoach.com>
